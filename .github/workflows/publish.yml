name: Publish to NPM

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Validate package metadata
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p \"require('./package.json').version\")"
          PKG_NAME="$(node -p \"require('./package.json').name\")"

          if [ "$PKG_NAME" != "@sertxito/mcpee-cloud" ]; then
            echo "❌ package name must be @sertxito/mcpee-cloud"
            exit 1
          fi

          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

          echo "✅ package metadata is valid"

      - name: Validate tag points to main history
        run: |
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "❌ Tag must reference a commit reachable from main"
            exit 1
          fi
          echo "✅ Tag commit is reachable from main"

      - name: Validate manifest
        run: npm run validate:manifest

      - name: Package dry run
        run: npm pack --dry-run

      - name: Publish package
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip publish when token is missing
        if: ${{ secrets.NPM_TOKEN == '' }}
        run: echo "⚠️ NPM_TOKEN is not configured. Skipping npm publish step."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
