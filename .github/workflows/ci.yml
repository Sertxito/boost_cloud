name: CI

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate package metadata
        run: |
          PKG_NAME="$(npm pkg get name | tr -d '"')"
          if [ "$PKG_NAME" != "@sertxito/mcpee-cloud" ]; then
            echo "❌ package.json name must be @sertxito/mcpee-cloud"
            exit 1
          fi
          echo "✅ package.json name is correct"

      - name: Validate mcpee manifest references
        run: npm run validate:manifest

      - name: Validate package dry run
        run: npm run pack:check
      
      - name: Check structure
        run: |
          # Verify critical files exist
          files=("README.md" "LICENSE" ".github/CODEOWNERS")
          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing: $file"
              exit 1
            fi
            echo "✅ Present: $file"
          done
      
      - name: Validate README
        run: |
          # Check README has required sections
          if ! grep -q "## Overview" README.md; then
            echo "❌ README missing '## Overview' section"
            exit 1
          fi
          if ! grep -q "## Quick Start" README.md; then
            echo "❌ README missing '## Quick Start' section"
            exit 1
          fi
          echo "✅ README structure valid"
      
      - name: Check License
        run: |
          if ! grep -q "MIT License" LICENSE; then
            echo "⚠️ License doesn't mention MIT"
          fi
          echo "✅ License file present"

  lint:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          globs: "**/*.md"

  security:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'MEDIUM,HIGH,CRITICAL'
