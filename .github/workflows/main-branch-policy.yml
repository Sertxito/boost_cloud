name: Main Branch Policy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  enforce:
    runs-on: ubuntu-latest

    steps:
      - name: Validate main updates come from PR
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const commit_sha = context.sha;

            const response = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha
            });

            if (!response.data || response.data.length === 0) {
              core.setFailed(`Commit ${commit_sha} on main is not associated with any pull request.`);
              return;
            }

            core.info(`Commit ${commit_sha} is associated with ${response.data.length} pull request(s).`);

      - name: PR check context
        if: github.event_name == 'pull_request'
        run: echo "Main branch policy check enabled for PR validation."
